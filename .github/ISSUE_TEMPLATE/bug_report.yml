name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do not open an issue. See SECURITY.md for how to report them privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `homelab_manager version`, or the commit if running from source.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04, x86-64
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - Installer (systemd service)
        - From source (npm run dev / npm start)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `sudo homelab_manager logs -n 100`, and any browser console errors. Remove anything private.
      render: text
