name: Feature request
description: Suggest something the dashboard should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Does it need extra privileges on the server? Are there tools that already do this well?
